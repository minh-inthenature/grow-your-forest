name: Build Windows EXE Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build GrowYourForest.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --icon=forest.ico `
            --name=GrowYourForest `
            --add-data="user_rain.mp3;." `
            --add-data="rain_master.wav;." `
            --add-data="rain_service.ps1;." `
            --add-data="forest.ico;." `
            --add-data="fonts;fonts" `
            app.py

      - name: Create Portable ZIP Release
        run: |
          Compress-Archive -Path app.py, audio_player.py, database.py, scenery.py, tree_renderer.py, forest_data.db, forest.ico, user_rain.mp3, rain_master.wav, rain_service.ps1, run.bat, create_shortcut.bat, fonts, README.md -DestinationPath GrowYourForest-Portable.zip -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GrowYourForest-Windows
          path: |
            dist/GrowYourForest.exe
            GrowYourForest-Portable.zip

      - name: Attach Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GrowYourForest.exe
            GrowYourForest-Portable.zip
